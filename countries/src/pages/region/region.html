<ion-header>
  <ion-navbar>
    <ion-title>RegionPage</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding>
  <div id="container">
    <ion-list *ngFor='let c of countries'>
      <ion-item>
        <ion-thumbnail item-start>
          <img src={{c.flag}}>
        </ion-thumbnail>
        <div id="country_name">
          <h2>{{c.name}}</h2>
        </div>
        <div id="region_name">
          <p>{{c.subregion}}</p>
        </div>
        <li ion-button (click)="selectCountry(c.name)">more info</li>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
