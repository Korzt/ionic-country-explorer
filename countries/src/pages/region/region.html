<ion-header>
  <ion-navbar>
    <ion-title>RegionPage</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding>
  <ion-list *ngFor='let c of countries'>
    <ion-item>
      <ion-thumbnail item-start>
        <img src={{c.flag}}>
      </ion-thumbnail>
        <h1>{{c.name}}</h1>
        <h3>{{c.subregion}}</h3>
        <li ion-button (click)="selectCountry(c.name)">more info</li>
    </ion-item>
  </ion-list>
</ion-content>
