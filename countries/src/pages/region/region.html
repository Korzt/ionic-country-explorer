<ion-header>
  <ion-navbar>
    <ion-title>RegionPage</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding>
  <ion-list *ngFor='let c of countries'>
    <ion-item>
      <ion-thumbnail item-start>
        <img src={{c.flag}}>
      </ion-thumbnail>
        <h2>{{c.name}}</h2>
        <ul>
          <li (click)="selectCountry(c.name)">INFO</li>
        </ul>
    </ion-item>
  </ion-list>
</ion-content>
