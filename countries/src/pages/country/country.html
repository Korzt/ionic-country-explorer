<!--
  Author: Eoin Wilkie

  CountryPage:
  Displays individual countries information in the following format:
  Country flag
  Country name, capital, population, area km2
  Region name, subregion
  Regional blocks
  Currencies
  Languages
-->
<ion-header>
  <ion-navbar>
    <ion-title>CountryPage</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding>
  <div id="container">
    <ion-list *ngFor='let c of countries'>
      <ion-item>

        <ion-img width="200" height="150" src={{c.flag}} alt="c.name flag not loaded.">
        </ion-img>

        <div id="country_name">
          <h1>{{c.name}}</h1>
        </div>

        <div id="country_details">
          <p>Capital: {{c.capital}}</p>
          <p>Population: {{formatNumber(c.population)}}</p>
          <p>Area: {{formatNumber(c.area)}}km²</p>
        </div>

        <div id="region_details">
          <p>Region: {{c.region}}</p>
          <p>Subregion: {{c.subregion}}</p>
        </div>

      <div id="list_title">
          <p>Regional Blocks:</p>
      </div>
        
      <div id="list_details">
        <ion-list *ngFor='let block of c.regionalBlocs'>
            <p>{{block.name}}</p>
        </ion-list>
      </div>

      <div id="list_title">
        <p>Currencies:</p>
      </div>
        
      <div id="list_details">
        <ion-list *ngFor='let currency of c.currencies'>
            <p>{{currency.name}}</p>
        </ion-list>
      </div>

      <div id="list_title">
        <p>Languages:</p>
      </div>
        
      <div id="list_details">
        <ion-list *ngFor='let language of c.languages'>
          <p>{{language.name}}</p>
        </ion-list>
      </div>

      </ion-item>
    </ion-list>
  </div>
</ion-content>
