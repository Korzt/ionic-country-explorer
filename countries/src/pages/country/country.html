<!--

  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->
<ion-header>
  <ion-navbar>
    <ion-title>CountryPage</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding>
  <ion-list *ngFor='let c of countries'>
    <ion-item>
      <ion-img width="200" height="150" src={{c.flag}}>
      </ion-img>
        <h1>{{c.name}}</h1>
        <p>Capital: {{c.capital}}</p>
        <p>Population: {{formatNumber(c.population)}}</p>
        <p>Area: {{formatNumber(c.area)}}km²</p>

        <p>Region: {{c.region}}</p>
        <p>Subregion: {{c.subregion}}</p>
        <p>Regional Blocks:</p>
        <ion-list *ngFor='let block of c.regionalBlocs'>
          <ion-item>
            <p>{{block.name}}</p>
          </ion-item>
        </ion-list>
        <p>Currencies:</p>
        <ion-list *ngFor='let currency of c.currencies'>
          <ion-item>
            <p>{{currency.name}}</p>
          </ion-item>
        </ion-list>
        <p>Languages:</p>
        <ion-list *ngFor='let language of c.languages'>
          <ion-item>
           <p>{{language.name}}</p>
          </ion-item>
        </ion-list>



    </ion-item>
  </ion-list>
</ion-content>
